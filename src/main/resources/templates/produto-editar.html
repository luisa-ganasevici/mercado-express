<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <meta charset="UTF-8">
    <title>Editar Produto - Mercado Express</title>
</head>
<body>

<h1>Editar Produto</h1>



<form th:action="@{/produtos/{id}/editar(id=${mercado.id})}" method="post" th:object="${mercado}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <input type="hidden" th:field="*{id}"/>

    <label>Nome</label><br>
    <input type="text" th:field="*{nome}" required><br>

    <label>Tipo</label><br>
    <input type="text" th:field="*{tipo}"><br>

    <label>Setor</label><br>
    <input type="text" th:field="*{setor}"><br>

    <label>Tamanho</label><br>
    <input type="text" th:field="*{tamanho}"><br>

    <label>Cor</label><br>
    <input type="text" th:field="*{cor}"><br>

    <label>Preço</label><br>
    <input type="number" step="0.01" th:field="*{preco}"><br>

    <label>Estoque</label><br>
    <input type="number" th:field="*{estoque}"><br>

    <label>Disponível</label><br>
    <input type="checkbox" th:field="*{disponivel}"><br><br>

    <button type="submit">Salvar alterações</button>
</form>

<a th:href="@{/produtos}"><button type="button">Cancelar</button></a>

</body>
</html>
