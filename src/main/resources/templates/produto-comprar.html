<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Comprar Produto - Mercado Express</title>
</head>
<body>

<h1>Confirmar Compra</h1>

<p><strong>Nome:</strong> <span th:text="${mercado.nome}"></span></p>
<p><strong>Tipo:</strong> <span th:text="${mercado.tipo}"></span></p>
<p><strong>Cor:</strong> <span th:text="${mercado.cor}"></span></p>
<p><strong>Tamanho:</strong> <span th:text="${mercado.tamanho}"></span></p>
<p><strong>Preço:</strong> <span th:text="${mercado.preco}"></span></p>
<p><strong>Estoque disponível:</strong> <span th:text="${mercado.estoque}"></span></p>

<form th:action="@{/produtos/{id}/comprar(id=${mercado.id})}" method="post">
  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
  <button type="submit">Confirmar compra</button>
</form>

<a th:href="@{/produtos}"><button type="button">Cancelar</button></a>

</body>
</html>
