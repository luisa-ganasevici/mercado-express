<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <title>Pedido recebido - Mercado Express</title>
</head>
<body>

<div class="titulo-bloco">
  <h1>Pedido recebido!</h1>
  <hr class="divisor">
</div>

<div class="dados-produto">
  <p><strong>Pedido nº:</strong> <span th:text="${pedido.id}"></span></p>
  <p><strong>Produto:</strong> <span th:text="${mercado.nome}"></span></p>
  <p><strong>Quantidade:</strong> <span th:text="${quantidade}"></span></p>
  <p><strong>Total:</strong> R$ <span th:text="${pedido.valorTotal}"></span></p>
  <p><strong>Status:</strong> <span th:text="${pedido.status}"></span></p>
  <p>Pagamento em análise pelo Banco Tranquilo. Acompanhe em "Meus pedidos".</p>
</div>

<div class="botoes">
  <a th:href="@{/meus-pedidos}"><button type="button">Meus pedidos</button></a>
  <a th:href="@{/produtos}"><button type="button">Voltar aos produtos</button></a>
</div>

</body>
</html>
