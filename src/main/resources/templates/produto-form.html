<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Novo Produto - Mercado Express</title>
</head>
<body>

<h1>Novo Produto</h1>

<form th:action="@{/produtos}" method="post" th:object="${mercado}">
  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

  <label>Nome</label><br>
  <input type="text" th:field="*{nome}" required><br>

  <label>Tipo</label><br>
  <input type="text" th:field="*{tipo}"><br>

  <label>Setor</label><br>
  <input type="text" th:field="*{setor}"><br>

  <label>Tamanho</label><br>
  <input type="text" th:field="*{tamanho}"><br>

  <label>Cor</label><br>
  <input type="text" th:field="*{cor}"><br>

  <label>Preço</label><br>
  <input type="number" step="0.01" th:field="*{preco}"><br>

  <label>Estoque</label><br>
  <input type="number" th:field="*{estoque}"><br>

  <button type="submit">Cadastrar</button>
</form>

<a th:href="@{/produtos}"><button type="button">Cancelar</button></a>

</body>
</html>
