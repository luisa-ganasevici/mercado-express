<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mercado Express</title>
</head>
<body>

<h1>Bem-vindo de volta!</h1>

<a th:href="@{/produtos}">
    <button type="button">Ver produtos</button>

</form>

</body>
</html>
