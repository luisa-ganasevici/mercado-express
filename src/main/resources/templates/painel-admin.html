<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Painel do Administrador - Mercado Express</title>
</head>
<body>

<div class="logout-topo">
    <form th:action="@{/logout}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit">Logout</button>
    </form>
</div>

<h1>Painel do Administrador</h1>
<hr class="divisor">

<div class="botoes">
    <a th:href="@{/admin/dashboard}"><button type="button">Dashboard</button></a>
    <a th:href="@{/produtos}"><button type="button">Produtos</button></a>
    <a th:href="@{/produtos/novo}"><button type="button">Novo produto</button></a>
    <a th:href="@{/usuarios}"><button type="button">Gerenciar usuários</button></a>
</div>

</body>
</html>
