<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <title>Dashboard - Mercado Express</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    .cards { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin: 24px 0; }
    .card { background: rgba(255,255,255,0.15); border-radius: 8px; padding: 16px 24px; min-width: 160px; text-align: center; }
    .card strong { display: block; font-size: 1.6em; margin-top: 6px; }
    .grafico { display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; }
    .grafico div { width: 420px; max-width: 100%; }
  </style>
</head>
<body>

<h1>Dashboard da Gerência</h1>
<hr class="divisor">

<div class="cards">
  <div class="card">Pedidos<strong th:text="${totalPedidos}"></strong></div>
  <div class="card">Pagos<strong th:text="${totalPagos}"></strong></div>
  <div class="card">Vendas (R$)<strong th:text="${#numbers.formatDecimal(receita,1,'POINT',2,'COMMA')}"></strong></div>
  <div class="card">Custo (R$)<strong th:text="${#numbers.formatDecimal(custo,1,'POINT',2,'COMMA')}"></strong></div>
  <div class="card">Lucro (R$)<strong th:text="${#numbers.formatDecimal(lucro,1,'POINT',2,'COMMA')}"></strong></div>
</div>

<div class="grafico">
  <div><canvas id="gVendas"></canvas></div>
  <div><canvas id="gLucro"></canvas></div>
  <div><canvas id="gEstoque"></canvas></div>
  <div><canvas id="gStatus"></canvas></div>
</div>

<h2>Compras realizadas</h2>
<table>
  <thead>
  <tr><th>Nº</th><th>Cliente</th><th>Produto</th><th>Qtd</th><th>Total</th><th>Status</th><th>Motivo</th><th>Data</th></tr>
  </thead>
  <tbody>
  <tr th:each="p : ${pedidos}">
    <td th:text="${p.id}"></td>
    <td th:text="${p.username}"></td>
    <td th:text="${p.mercado.nome}"></td>
    <td th:text="${p.quantidade}"></td>
    <td th:text="${p.valorTotal}"></td>
    <td th:text="${p.status}"></td>
    <td th:text="${p.motivo}"></td>
    <td th:text="${#temporals.format(p.dataPedido, 'dd/MM/yyyy HH:mm')}"></td>
  </tr>
  </tbody>
</table>

<div class="botoes">
  <a th:href="@{/admin/painel}"><button type="button">Voltar ao painel</button></a>
</div>

<script th:inline="javascript">
  Chart.defaults.color = '#ffffff';
  const vendasLabels = /*[[${vendasLabels}]]*/ [];
  const vendasValores = /*[[${vendasValores}]]*/ [];
  const lucroValores = /*[[${lucroValores}]]*/ [];
  const estoqueLabels = /*[[${estoqueLabels}]]*/ [];
  const estoqueValores = /*[[${estoqueValores}]]*/ [];
  const statusLabels = /*[[${statusLabels}]]*/ [];
  const statusValores = /*[[${statusValores}]]*/ [];

  new Chart(document.getElementById('gVendas'), {
      type: 'bar',
      data: { labels: vendasLabels, datasets: [{ label: 'Vendas por produto (R$)', data: vendasValores, backgroundColor: '#4f8ef7' }] }
  });
  new Chart(document.getElementById('gLucro'), {
      type: 'bar',
      data: { labels: vendasLabels, datasets: [{ label: 'Lucro por produto (R$)', data: lucroValores, backgroundColor: '#3ecf8e' }] }
  });
  new Chart(document.getElementById('gEstoque'), {
      type: 'bar',
      data: { labels: estoqueLabels, datasets: [{ label: 'Estoque atual', data: estoqueValores, backgroundColor: '#f5a623' }] }
  });
  new Chart(document.getElementById('gStatus'), {
      type: 'doughnut',
      data: { labels: statusLabels, datasets: [{ data: statusValores, backgroundColor: ['#f5a623', '#3ecf8e', '#e5534b'] }] }
  });
</script>

</body>
</html>
