<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <title>Dashboard - Mercado Express</title>
  <style>
    .cards { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin: 24px 0; }
    .card { background: #e8f0fc; color: #0d47a1; border-radius: 10px; padding: 16px 24px; min-width: 160px; text-align: center; font-size: 14px; }
    .card strong { display: block; font-size: 1.6em; margin-top: 6px; }

    .graficos { display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; }
    .painel { width: 420px; max-width: 100%; background: #ffffff; border: 1px solid #d6e2f5; border-radius: 12px; padding: 14px 18px; box-shadow: 0 4px 14px rgba(13, 71, 161, 0.10); }
    .painel h3 { margin: 4px 0 12px; font-size: 16px; }
    .linha { display: grid; grid-template-columns: 110px 1fr 95px; align-items: center; gap: 8px; margin: 9px 0; font-size: 14px; }
    .rotulo { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .trilho { background: #e8f0fc; border-radius: 6px; height: 16px; }
    .barra { background: #1565c0; height: 100%; border-radius: 6px; }
    .valor { text-align: right; font-weight: 600; color: #0d47a1; }
    .vazio { text-align: center; color: #7a8bb0; font-size: 14px; }

    .lucro .barra { background: #42a5f5; }
    .estoque .barra { background: #90caf9; }
    .status .barra.PENDENTE { background: #90caf9; }
    .status .barra.PAGO { background: #1565c0; }
    .status .barra.RECUSADO { background: #e5534b; }
  </style>
</head>
<body>

<h1>Dashboard da Gerência</h1>
<hr class="divisor">

<div class="cards">
  <div class="card">Pedidos<strong th:text="${totalPedidos}"></strong></div>
  <div class="card">Pagos<strong th:text="${totalPagos}"></strong></div>
  <div class="card">Vendas (R$)<strong th:text="${#numbers.formatDecimal(receita,1,'POINT',2,'COMMA')}"></strong></div>
  <div class="card">Custo (R$)<strong th:text="${#numbers.formatDecimal(custo,1,'POINT',2,'COMMA')}"></strong></div>
  <div class="card">Lucro (R$)<strong th:text="${#numbers.formatDecimal(lucro,1,'POINT',2,'COMMA')}"></strong></div>
</div>

<div class="graficos">

  <div class="painel">
    <h3>Vendas por produto</h3>
    <p class="vazio" th:if="${#lists.isEmpty(vendas)}">Sem vendas pagas ainda.</p>
    <div class="linha" th:each="b : ${vendas}">
      <span class="rotulo" th:text="${b.rotulo()}"></span>
      <div class="trilho"><div class="barra" th:style="'width:' + ${b.pct()} + '%'"></div></div>
      <span class="valor" th:text="${b.texto()}"></span>
    </div>
  </div>

  <div class="painel lucro">
    <h3>Lucro por produto</h3>
    <p class="vazio" th:if="${#lists.isEmpty(lucros)}">Sem vendas pagas ainda.</p>
    <div class="linha" th:each="b : ${lucros}">
      <span class="rotulo" th:text="${b.rotulo()}"></span>
      <div class="trilho"><div class="barra" th:style="'width:' + ${b.pct()} + '%'"></div></div>
      <span class="valor" th:text="${b.texto()}"></span>
    </div>
  </div>

  <div class="painel estoque">
    <h3>Estoque atual</h3>
    <p class="vazio" th:if="${#lists.isEmpty(estoque)}">Sem produtos.</p>
    <div class="linha" th:each="b : ${estoque}">
      <span class="rotulo" th:text="${b.rotulo()}"></span>
      <div class="trilho"><div class="barra" th:style="'width:' + ${b.pct()} + '%'"></div></div>
      <span class="valor" th:text="${b.texto()}"></span>
    </div>
  </div>

  <div class="painel status">
    <h3>Pedidos por status</h3>
    <div class="linha" th:each="b : ${status}">
      <span class="rotulo" th:text="${b.rotulo()}"></span>
      <div class="trilho"><div class="barra" th:classappend="${b.rotulo()}" th:style="'width:' + ${b.pct()} + '%'"></div></div>
      <span class="valor" th:text="${b.texto()}"></span>
    </div>
  </div>

</div>

<h2>Compras realizadas</h2>
<table>
  <thead>
  <tr><th>Nº</th><th>Cliente</th><th>Produto</th><th>Qtd</th><th>Total</th><th>Status</th><th>Motivo</th><th>Data</th></tr>
  </thead>
  <tbody>
  <tr th:each="p : ${pedidos}">
    <td th:text="${p.id}"></td>
    <td th:text="${p.username}"></td>
    <td th:text="${p.mercado.nome}"></td>
    <td th:text="${p.quantidade}"></td>
    <td th:text="${p.valorTotal}"></td>
    <td th:text="${p.status}"></td>
    <td th:text="${p.motivo}"></td>
    <td th:text="${#temporals.format(p.dataPedido, 'dd/MM/yyyy HH:mm')}"></td>
  </tr>
  </tbody>
</table>

<div class="botoes">
  <a th:href="@{/admin/painel}"><button type="button">Voltar ao painel</button></a>
</div>

</body>
</html>
